<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#069fc2"/></marker></defs><g font-family="Microsoft YaHei UI,Microsoft YaHei,Arial"><rect x="1" y="1" width="718" height="298" rx="10" fill="#f3f8fc" stroke="#cbdced"/><rect x="18" y="15" width="162" height="34" rx="8" fill="#e6eff8" stroke="none"/><text x="32" y="37" font-size="14" font-weight="600" fill="#607b96">1 申请 API</text><rect x="192" y="15" width="162" height="34" rx="8" fill="#e6eff8" stroke="none"/><text x="206" y="37" font-size="14" font-weight="600" fill="#607b96">2 配置密钥</text><rect x="366" y="15" width="162" height="34" rx="8" fill="#e6eff8" stroke="none"/><text x="380" y="37" font-size="14" font-weight="600" fill="#607b96">3 选择配方</text><rect x="540" y="15" width="162" height="34" rx="8" fill="#079cc0" stroke="none"/><text x="554" y="37" font-size="14" font-weight="600" fill="#ffffff">4 创建与支付</text><rect x="30" y="69" width="295" height="210" rx="10" fill="#ffffff" stroke="#cbdced"/><text x="49" y="98" font-size="20" font-weight="600" fill="#12304a">① 创建合炉</text><text x="49" y="133" font-size="15" font-weight="400" fill="#12304a">核对账号、材料、售价、开炉费</text><text x="49" y="168" font-size="15" font-weight="400" fill="#12304a">选择公开 / 私密与人齐自开</text><text x="49" y="203" font-size="15" font-weight="400" fill="#12304a">提交创建，等待 ECO 计算</text><text x="49" y="249" font-size="15" font-weight="600" fill="#159660">此步骤不会自动支付押金</text><path d="M338 174L372 174" stroke="#069fc2" stroke-width="3" marker-end="url(#arrow)"/><rect x="387" y="69" width="303" height="210" rx="10" fill="#ffffff" stroke="#cbdced"/><text x="406" y="98" font-size="20" font-weight="600" fill="#12304a">② 我的合炉</text><text x="406" y="133" font-size="15" font-weight="400" fill="#12304a">查询「拼炉中」，按标题确认</text><text x="406" y="168" font-size="15" font-weight="400" fill="#12304a">先在 ECO 核对实际押金金额</text><text x="406" y="203" font-size="15" font-weight="400" fill="#12304a">选中可支付的炉子并确认扣款</text><text x="406" y="249" font-size="14" font-weight="600" fill="#b65c12">网络超时先查询，避免重复提交</text></g></svg>